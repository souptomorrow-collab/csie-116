<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>資工所推甄 116</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --ink: #131A21; --muted: #55616D; --line: #D6DCE2;
  --ntust: #0A7470; --nycu: #3A48A8; --crit: #B3261E; --crit-soft: #FCE3E0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1318; --surface: #161D24; --ink: #E5EAEF; --muted: #9CA8B4; --line: #29343F;
    --ntust: #52C6BE; --nycu: #9AA5FF; --crit: #FF8B7E; --crit-soft: #3B1714;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.7 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  display: grid;
  place-items: center;
  padding-inline: 16px;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
}
.card {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 28px 26px 24px;
}
.eyebrow { margin: 0 0 4px; font-size: 12.5px; letter-spacing: .08em; color: var(--muted); }
h1 { margin: 0; font: 900 30px/1.25 "Noto Serif TC", "Songti TC", "PMingLiU", serif; }
.vs { margin: 4px 0 20px; font-weight: 700; }
.vs .t { color: var(--ntust); }
.vs .n { color: var(--nycu); }
label[for="pw"] { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
input[type="password"] {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}
input[type="password"]:focus { outline: 2px solid var(--nycu); outline-offset: 1px; border-color: transparent; }
.remember { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--nycu); }
button {
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  color: #fff;
  background: var(--ink);
  border: 0;
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
}
@media (prefers-color-scheme: dark) { button { color: var(--bg); } }
button:disabled { opacity: .6; cursor: progress; }
button:focus-visible { outline: 2px solid var(--nycu); outline-offset: 2px; }
.msg { min-height: 1.5em; margin: 12px 0 0; font-size: 13.5px; }
.msg.err { color: var(--crit); }
noscript p { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--crit-soft); color: var(--crit); font-size: 13.5px; }
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">116 學年度碩士班甄試</p>
  <h1>資工所推甄</h1>
  <p class="vs"><span class="t">台科大</span> × <span class="n">陽明交大</span></p>
  <form id="gate" autocomplete="on">
    <input type="text" name="username" value="csie-116" autocomplete="username" hidden>
    <label for="pw">請輸入密碼</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <label class="remember"><input type="checkbox" id="remember"> 在這台裝置記住</label>
    <button type="submit" id="go">開啟</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>
  <noscript><p>這個頁面需要啟用 JavaScript 才能解密。</p></noscript>
</main>

  var STORE = 'csie116-key';
  var subtle = window.crypto && window.crypto.subtle;
  var form = document.getElementById('gate');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');

  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function say(text, err) { msg.textContent = text; msg.className = 'msg' + (err ? ' err' : ''); }

  function derive(password) {
    return subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }
  function decrypt(key) {
    return subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct)).then(function (pt) {
      return new TextDecoder().decode(pt);
    });
  }
  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  if (!subtle) {
    say('這個瀏覽器不支援解密，請改用新版 Chrome、Edge、Safari 或 Firefox。', true);
    go.disabled = true;
    return;
  }

  // 記住過的裝置：直接用存下的金鑰解密；頁面更新或密碼更換後會失效，改回輸入密碼
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    say('解鎖中…');
    subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt'])
      .then(decrypt)
      .then(show)
      .catch(function () {
        try { localStorage.removeItem(STORE); } catch (e) {}
        say('');
      });
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    go.disabled = true;
    say('解鎖中…');
    var remember = document.getElementById('remember').checked;
    derive(pw.value).then(function (key) {
      return decrypt(key).then(function (html) {
        if (!remember) return html;
        return subtle.exportKey('raw', key).then(function (raw) {
          try { localStorage.setItem(STORE, b64(raw)); } catch (e) {}
          return html;
        });
      });
    }).then(show).catch(function () {
      go.disabled = false;
      say('密碼不對，請再試一次。', true);
      pw.select();
    });
  });
